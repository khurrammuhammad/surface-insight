name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out or do?
      description: Describe the problem, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: hardware
    attributes:
      label: Hardware or Windows limits you know about
      description: For example, a sensor Windows exposes on your device that the app doesn't use yet.
  - type: markdown
    attributes:
      value: Surface Insight is deliberately local-only (no uploads, no accounts, no automatic system changes). Ideas that need any of those are out of scope.
