name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, e.g. v1.1.1. Requires release-environment signing and acceptance approval. Leave empty for tests.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Test ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Portable security regression tests
        shell: pwsh
        run: |
          dotnet run --project tests/CoreTests/CoreTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Core regression tests failed.' }
          ./scripts/test-install.ps1
      - name: Build this architecture
        shell: pwsh
        run: ./scripts/build.ps1 -Arch ${{ matrix.arch }} -SingleFile
      - name: Test both executable forms natively
        shell: pwsh
        run: |
          foreach ($folder in 'out/publish-win-${{ matrix.arch }}', 'out/publish-single-win-${{ matrix.arch }}') {
            $process = Start-Process "$folder/SurfaceInsight.exe" -ArgumentList '--self-test','--ci' -PassThru
            if (!$process.WaitForExit(180000)) { $process.Kill(); throw 'Self-test timed out.' }
            Get-Content "$folder/self-test.txt"
            if ($process.ExitCode -ne 0) { throw "Self-test failed: $folder" }
          }
      - name: Isolated dashboard and update startup smoke test
        shell: pwsh
        run: ./scripts/test-runtime.ps1 -Publish out/publish-win-${{ matrix.arch }}
      - name: Stage candidate
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/SurfaceInsight/SurfaceInsight.csproj -Raw)).Project.PropertyGroup.Version
          New-Item -ItemType Directory -Force candidate | Out-Null
          Copy-Item "dist/SurfaceInsight-$version-win-${{ matrix.arch }}.zip" "candidate/SurfaceInsight-win-${{ matrix.arch }}.zip"
          Copy-Item "dist/SurfaceInsight-$version-win-${{ matrix.arch }}.exe" "candidate/SurfaceInsight-win-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-${{ matrix.arch }}
          path: candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  sign:
    name: Sign and retest ${{ matrix.arch }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release identity
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          WINDOWS_ACCEPTED_COMMIT: ${{ vars.WINDOWS_ACCEPTED_COMMIT }}
        run: |
          if ($env:WINDOWS_ACCEPTED_COMMIT -ne $env:GITHUB_SHA) { throw 'Complete docs/Release-Checklist.md for this exact commit and set WINDOWS_ACCEPTED_COMMIT in the release environment.' }
          $version = ([xml](Get-Content src/SurfaceInsight/SurfaceInsight.csproj -Raw)).Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -ne "v$version") { throw 'Tag must match the project version.' }
          $tagCommit = git rev-parse --verify "$($env:RELEASE_TAG)^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) { throw 'The existing tag must point to the exact tested commit.' }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Only commits reachable from main may be released.' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-${{ matrix.arch }}
          path: signed
      - name: Sign and retest the final executable bytes
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $parameters = @{ Zip = 'signed/SurfaceInsight-win-${{ matrix.arch }}.zip'; SingleFile = 'signed/SurfaceInsight-win-${{ matrix.arch }}.exe' }
          if ('${{ matrix.arch }}' -eq 'x64') {
            Copy-Item scripts/install.ps1 signed/install.ps1
            $parameters.Installer = 'signed/install.ps1'
          }
          ./scripts/sign-release.ps1 @parameters
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-${{ matrix.arch }}
          path: signed/*
          if-no-files-found: error
          compression-level: 0

  release:
    needs: sign
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: signed-*
          merge-multiple: true
          path: release
      - name: Checksums for final signed assets
        working-directory: release
        run: sha256sum SurfaceInsight-win-*.zip SurfaceInsight-win-*.exe install.ps1 > SHA256SUMS.txt
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*
      - name: Publish a draft for final review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('Invalid release tag')
          header = pathlib.Path('.github/release-header.md').read_text().replace('{{TAG}}', tag)
          pathlib.Path('release-notes.md').write_text(header)
          PY
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* --draft --verify-tag --title "Surface Insight $RELEASE_TAG" --notes-file release-notes.md
