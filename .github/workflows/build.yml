name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build x64 and Arm64 packages
        shell: pwsh
        run: ./scripts/build.ps1 -Arch all

      - name: Self-test (x64 build, no live hardware checks)
        shell: pwsh
        run: |
          $p = Start-Process ./out/publish-win-x64/SurfaceInsight.exe -ArgumentList '--self-test','--ci' -PassThru -Wait
          Get-Content ./out/publish-win-x64/self-test.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: SurfaceInsight-packages
          path: dist/*.zip
          retention-days: 14
          compression-level: 0

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*.zip).FullName --title "Surface Insight ${{ github.ref_name }}" --generate-notes
