name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (for example v1.1.0). Leave empty to only build and test. Must match <Version> in the project file and run from main.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build x64 and Arm64 packages (zip and single-file exe)
        shell: pwsh
        run: ./scripts/build.ps1 -Arch all -SingleFile

      - name: Self-test (x64 zip build, no live hardware checks)
        shell: pwsh
        run: |
          $p = Start-Process ./out/publish-win-x64/SurfaceInsight.exe -ArgumentList '--self-test','--ci' -PassThru -Wait
          Get-Content ./out/publish-win-x64/self-test.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit $($p.ExitCode))" }

      # The single-file exe is only published when it passes the same test. If it fails, the zips still ship.
      - name: Self-test (x64 single-file exe)
        id: sfx
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process ./out/publish-single-win-x64/SurfaceInsight.exe -ArgumentList '--self-test','--ci' -PassThru -Wait
          Get-Content ./out/publish-single-win-x64/self-test.txt
          if ($p.ExitCode -ne 0) { throw "Single-file self-test failed (exit $($p.ExitCode))" }

      - name: Stage release files
        shell: pwsh
        run: |
          if ('${{ steps.sfx.outcome }}' -eq 'success') { ./scripts/stage-release.ps1 } else { Write-Warning 'Single-file exe failed its self-test and is left out.'; ./scripts/stage-release.ps1 -NoExe }

      - uses: actions/upload-artifact@v7
        with:
          name: SurfaceInsight-packages
          path: dist/release/*
          retention-days: 14
          compression-level: 0

      - name: Publish release
        # Runs for a pushed v* tag, or for a manual run on main that names a release tag.
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release tag '$tag' must look like v1.2.3" }
          $version = ([xml](Get-Content src/SurfaceInsight/SurfaceInsight.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($tag -ne "v$version") { throw "Tag $tag does not match <Version> $version in the project file. Bump the version first." }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists." }
          $generated = gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name=$tag -f target_commitish=$env:GITHUB_SHA --jq .body
          $header = (Get-Content .github/release-header.md -Raw).Replace('{{TAG}}', $tag)
          Set-Content release-notes.md ($header + $generated) -Encoding utf8
          gh release create $tag (Get-ChildItem dist/release/*).FullName --target $env:GITHUB_SHA --title "Surface Insight $tag" --notes-file release-notes.md
